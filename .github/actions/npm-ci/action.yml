name: NPM install
description: Run npm ci, or restore node_modules from the cache (per OS, CPU, lockfile and Node version)

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
    - name: Restore dependencies
      id: restore-modules
      uses: actions/cache/restore@v5
      with:
        path: "node_modules"
        key: node_modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', '.nvmrc') }}
    - name: Run npm ci
      if: ${{ steps.restore-modules.outputs.cache-hit != 'true'  }}
      shell: bash
      run: |
        npm ci
    - name: Cache dependencies
      if: ${{ steps.restore-modules.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: "node_modules"
        key: node_modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', '.nvmrc') }}
