name: NPM consumer smoke test

# This tests the latest *published* npm release, not the triggering commit, so
# it never needs to run on PRs. It runs on every master push so that a broken
# published package shows up as a failing master before the next release.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout fixtures
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Install isolated consumer dependencies
        working-directory: test/consumer-smoke
        run: bun install --no-progress

      - name: Bundle with Bun and run browser smoke
        working-directory: test/consumer-smoke
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: bun run smoke

      - name: Note that a published release was tested
        if: failure()
        working-directory: test/consumer-smoke
        run: |
          version=$(jq -r .version node_modules/prebid.js/package.json 2>/dev/null || echo unknown)
          msg="This smoke test bundles the latest PUBLISHED prebid.js from npm ($version), not the commit that triggered this run (${GITHUB_SHA::9}). The failure may come from that older release and already be fixed on master, or from a change in Bun, Chrome or another dependency."
          echo "::error title=npm consumer smoke failed on published prebid.js $version::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
