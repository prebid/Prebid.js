name: Vitest runner trial (non-blocking)

# Runs the existing unit specs, bundled by Karma's own webpack/Babel config,
# under Vitest Browser Mode in Chromium, chunked like the Karma job. This is
# a trial alongside Karma (prebid/Prebid.js#10806); Karma remains the gate.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'test/vitest-webpack/**'
      - '.github/workflows/vitest-webpack.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'karma.conf.maker.js'

permissions:
  contents: read

jobs:
  vitest:
    name: Vitest Chromium (chunk ${{ matrix.chunk }})
    strategy:
      fail-fast: false
      matrix:
        chunk: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Precompile
        run: npx gulp precompile
      - name: Build and run chunk ${{ matrix.chunk }}
        env:
          TEST_CHUNKS: '8'
          TEST_CHUNK: ${{ matrix.chunk }}
        run: npm run test:vitest
