name: Vitest runner trial (non-blocking)

# Runs the existing unit specs, bundled by Karma's own webpack/Babel config,
# under Vitest Browser Mode in Chromium, chunked like the Karma job. This is
# a trial alongside Karma (prebid/Prebid.js#10806); Karma remains the gate.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'test/vitest-webpack/**'
      - '.github/workflows/vitest-webpack.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'karma.conf.maker.js'

permissions:
  contents: read

jobs:
  vitest:
    name: Vitest Chromium (${{ matrix.variant }}, chunk ${{ matrix.chunk }})
    strategy:
      fail-fast: false
      matrix:
        chunk: [1, 2, 3, 4, 5, 6, 7, 8]
        # Like Karma's "Unit tests (all features disabled)" job: the variant is whatever tree
        # the precompile step leaves in dist/src, which karma.conf.maker.js's webpack config reads.
        variant: [default, all-features-disabled]
        include:
          - variant: default
            precompile: npx gulp precompile
          - variant: all-features-disabled
            precompile: npx gulp precompile-all-features-disabled
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: npm ci
      # ubuntu-latest already has the system libraries Chromium needs (it ships Google Chrome); --with-deps
      # would add an apt-get run of 10s or more, occasionally minutes, to every job.
      - name: Install browser
        run: npx playwright install chromium
      # These caches are content-addressed, so an entry from another commit is only ever a hit or a miss,
      # never stale. Restored, they take about half off precompile and webpack time (#16009).
      - name: Restore precompile and babel caches
        uses: actions/cache@v5
        with:
          path: |
            .cache/precompile
            .cache/ts
            .cache/babel-loader
          key: vitest-${{ matrix.variant }}-${{ matrix.chunk }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            vitest-${{ matrix.variant }}-${{ matrix.chunk }}-${{ hashFiles('package-lock.json') }}-
      - name: Precompile (${{ matrix.variant }})
        run: ${{ matrix.precompile }}
      - name: Build and run chunk ${{ matrix.chunk }}
        env:
          TEST_CHUNKS: '8'
          TEST_CHUNK: ${{ matrix.chunk }}
        run: npm run test:vitest
