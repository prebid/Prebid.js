name: Vitest runner trial (non-blocking)

# Runs the existing unit specs under Vitest Browser Mode in Chromium, Firefox,
# WebKit, Edge and Chrome 113, chunked like the Karma job. Each job runs one Karma
# chunk: most specs as native ES modules served by Vite (test/vitest-native), the
# rest bundled by Karma's own webpack/Babel config (test/vitest-webpack). This is a
# trial alongside Karma (prebid/Prebid.js#10806, #16010); Karma remains the gate.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'test/vitest-webpack/**'
      - 'test/vitest-native/**'
      - '.github/workflows/vitest-webpack.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'karma.conf.maker.js'

permissions:
  contents: read

jobs:
  vitest:
    name: Vitest Chromium (${{ matrix.variant }}, chunk ${{ matrix.chunk }})
    strategy:
      fail-fast: false
      matrix:
        chunk: [1, 2, 3, 4, 5, 6, 7, 8]
        # Like Karma's "Unit tests (all features disabled)" job: the variant is whatever tree
        # the precompile step leaves in dist/src, which karma.conf.maker.js's webpack config reads.
        variant: [default, all-features-disabled]
        include:
          - variant: default
            precompile: npx gulp precompile
            # like Karma, coverage comes from the default variant
            coverage: '1'
          - variant: all-features-disabled
            precompile: npx gulp precompile-all-features-disabled
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: npm ci
      # ubuntu-latest already has the system libraries Chromium needs (it ships Google Chrome); --with-deps
      # would add an apt-get run of 10s or more, occasionally minutes, to every job.
      - name: Install browser
        run: npx playwright install chromium
      # Restored, these caches take about half off precompile and webpack time (#16009). They are keyed on
      # each source file's contents, but not on the build system itself (see gulp.precompilation.js): a
      # change to the Babel config, the local Babel plugins, the precompile code or the dependencies would
      # otherwise reuse stale output. Those files are hashed into the key, so such a change starts empty.
      - name: Restore precompile and babel caches
        uses: actions/cache@v5
        with:
          path: |
            .cache/precompile
            .cache/ts
            .cache/babel-loader
          key: vitest-${{ matrix.variant }}-${{ matrix.chunk }}-${{ hashFiles('package-lock.json', 'babelConfig.js', 'plugins/**', 'gulp.precompilation.js', 'gulpHelpers.js', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            vitest-${{ matrix.variant }}-${{ matrix.chunk }}-${{ hashFiles('package-lock.json', 'babelConfig.js', 'plugins/**', 'gulp.precompilation.js', 'gulpHelpers.js', 'tsconfig.json') }}-
      - name: Precompile (${{ matrix.variant }})
        run: ${{ matrix.precompile }}
      - name: Build and run chunk ${{ matrix.chunk }} (webpack bridge)
        env:
          TEST_CHUNKS: '8'
          TEST_CHUNK: ${{ matrix.chunk }}
          VITEST_COVERAGE: ${{ matrix.coverage }}
        run: npm run test:vitest
      - name: Run chunk ${{ matrix.chunk }} (native)
        if: ${{ !cancelled() }}
        env:
          TEST_CHUNKS: '8'
          TEST_CHUNK: ${{ matrix.chunk }}
          VITEST_COVERAGE: ${{ matrix.coverage }}
        run: npm run test:vitest-native
      - name: Upload coverage
        if: ${{ matrix.coverage && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: vitest-coverage-${{ matrix.chunk }}
          # build/coverage/chunks/<chunk>/lcov.info, the layout Karma's coverage jobs produce, from the
          # bridge; build/coverage/chunks/native/<chunk>/lcov.info from the native project
          path: build/coverage/chunks
          if-no-files-found: error

  # Combines the chunks the way .github/actions/combine-coverage does for Karma, so the totals in the
  # job summary can be compared with Karma's coverage report (#16004).
  vitest-coverage:
    name: Vitest coverage
    needs: [vitest]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: vitest-coverage-*
          path: build/coverage/chunks
          merge-multiple: true
      - name: Combine coverage results
        run: |
          # a chunk that failed before writing coverage would otherwise leave a plausible but partial total.
          # Every chunk has native specs; the bridge only writes a report for a chunk with bridge specs in it.
          for chunk in 1 2 3 4 5 6 7 8; do
            if [ ! -s "build/coverage/chunks/native/$chunk/lcov.info" ]; then
              echo "::error::No coverage for chunk $chunk; not combining a partial result"
              exit 1
            fi
          done
          sudo apt-get update
          sudo apt-get install lcov -y
          find build/coverage/chunks -name 'lcov.info' -printf ' -a %p' | xargs lcov -o coverage.info
          { echo '### Vitest coverage'; echo '```'; lcov --summary coverage.info 2>&1; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: vitest-coverage
          path: coverage.info

  # The rest of Karma's runner browsers (.github/workflows/browser_testing.json), on the same runner OS
  # as their Karma jobs. Like Karma, only the default variant runs on these; BrowserStack is #16006.
  vitest-browsers:
    name: Vitest ${{ matrix.browser }} (chunk ${{ matrix.chunk }})
    strategy:
      fail-fast: false
      matrix:
        chunk: [1, 2, 3, 4, 5, 6, 7, 8]
        browser: [Firefox, WebKit, Edge, Chrome 113]
        include:
          # Karma: FirefoxHeadless on ubuntu-latest
          - browser: Firefox
            runs-on: ubuntu-latest
            vitest-browser: firefox
            playwright: firefox
          # Karma: SafariNative on macos-latest. Playwright's WebKit is the closest thing it can drive.
          - browser: WebKit
            runs-on: macos-latest
            vitest-browser: webkit
            playwright: webkit
          # Karma: EdgeHeadless on windows-latest, which has Microsoft Edge installed
          - browser: Edge
            runs-on: windows-latest
            channel: msedge
          # Karma: "ChromeNoSandbox 113", the same binary from @puppeteer/browsers (see run-tests.yml)
          - browser: Chrome 113
            runs-on: ubuntu-latest
            chrome-version: 113.0.5672.0
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        if: ${{ matrix.playwright }}
        run: npx playwright install --with-deps ${{ matrix.playwright }}
      - name: Install Chrome ${{ matrix.chrome-version }}
        if: ${{ matrix.chrome-version }}
        env:
          CHROME_VERSION: ${{ matrix.chrome-version }}
        run: |
          out=($(npx @puppeteer/browsers install "chrome@$CHROME_VERSION"))
          echo "VITEST_EXECUTABLE_PATH=${out[1]}" >> "$GITHUB_ENV"
      - name: Precompile
        run: npx gulp precompile
      - name: Build and run chunk ${{ matrix.chunk }} (webpack bridge)
        env:
          TEST_CHUNKS: '8'
          TEST_CHUNK: ${{ matrix.chunk }}
          VITEST_BROWSER: ${{ matrix.vitest-browser }}
          VITEST_CHANNEL: ${{ matrix.channel }}
        run: npm run test:vitest
      - name: Run chunk ${{ matrix.chunk }} (native)
        if: ${{ !cancelled() }}
        env:
          TEST_CHUNKS: '8'
          TEST_CHUNK: ${{ matrix.chunk }}
          VITEST_BROWSER: ${{ matrix.vitest-browser }}
          VITEST_CHANNEL: ${{ matrix.channel }}
        run: npm run test:vitest-native
