name: Vitest runner trial (non-blocking)

# Runs the existing unit specs, bundled by Karma's own webpack/Babel config,
# under Vitest Browser Mode in Chromium, Firefox, WebKit, Edge, Chrome 113 and
# (when BrowserStack secrets are available) Safari on a real iOS 16 device,
# chunked like the Karma job. This is a trial alongside Karma
# (prebid/Prebid.js#10806); Karma remains the gate.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'test/vitest-webpack/**'
      - '.github/workflows/vitest-webpack.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'karma.conf.maker.js'

permissions:
  contents: read

jobs:
  vitest:
    name: Vitest Chromium (${{ matrix.variant }}, chunk ${{ matrix.chunk }})
    strategy:
      fail-fast: false
      matrix:
        chunk: [1, 2, 3, 4, 5, 6, 7, 8]
        # Like Karma's "Unit tests (all features disabled)" job: the variant is whatever tree
        # the precompile step leaves in dist/src, which karma.conf.maker.js's webpack config reads.
        variant: [default, all-features-disabled]
        include:
          - variant: default
            precompile: npx gulp precompile
            # like Karma, coverage comes from the default variant
            coverage: '1'
          - variant: all-features-disabled
            precompile: npx gulp precompile-all-features-disabled
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: npm ci
      # ubuntu-latest already has the system libraries Chromium needs (it ships Google Chrome); --with-deps
      # would add an apt-get run of 10s or more, occasionally minutes, to every job.
      - name: Install browser
        run: npx playwright install chromium
      # Restored, these caches take about half off precompile and webpack time (#16009). They are keyed on
      # each source file's contents, but not on the build system itself (see gulp.precompilation.js): a
      # change to the Babel config, the local Babel plugins, the precompile code or the dependencies would
      # otherwise reuse stale output. Those files are hashed into the key, so such a change starts empty.
      - name: Restore precompile and babel caches
        uses: actions/cache@v5
        with:
          path: |
            .cache/precompile
            .cache/ts
            .cache/babel-loader
          key: vitest-${{ matrix.variant }}-${{ matrix.chunk }}-${{ hashFiles('package-lock.json', 'babelConfig.js', 'plugins/**', 'gulp.precompilation.js', 'gulpHelpers.js', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            vitest-${{ matrix.variant }}-${{ matrix.chunk }}-${{ hashFiles('package-lock.json', 'babelConfig.js', 'plugins/**', 'gulp.precompilation.js', 'gulpHelpers.js', 'tsconfig.json') }}-
      - name: Precompile (${{ matrix.variant }})
        run: ${{ matrix.precompile }}
      - name: Build and run chunk ${{ matrix.chunk }}
        env:
          TEST_CHUNKS: '8'
          TEST_CHUNK: ${{ matrix.chunk }}
          VITEST_COVERAGE: ${{ matrix.coverage }}
        run: npm run test:vitest
      - name: Upload coverage
        if: ${{ matrix.coverage && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: vitest-coverage-${{ matrix.chunk }}
          # build/coverage/chunks/<chunk>/lcov.info, the layout Karma's coverage jobs produce
          path: build/coverage/chunks
          if-no-files-found: error

  # Combines the chunks the way .github/actions/combine-coverage does for Karma, so the totals in the
  # job summary can be compared with Karma's coverage report (#16004).
  vitest-coverage:
    name: Vitest coverage
    needs: [vitest]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: vitest-coverage-*
          path: build/coverage/chunks
          merge-multiple: true
      - name: Combine coverage results
        run: |
          # a chunk that failed before writing coverage would otherwise leave a plausible but partial total
          for chunk in 1 2 3 4 5 6 7 8; do
            if [ ! -s "build/coverage/chunks/$chunk/lcov.info" ]; then
              echo "::error::No coverage for chunk $chunk; not combining a partial result"
              exit 1
            fi
          done
          sudo apt-get update
          sudo apt-get install lcov -y
          find build/coverage/chunks -name 'lcov.info' -printf ' -a %p' | xargs lcov -o coverage.info
          { echo '### Vitest coverage'; echo '```'; lcov --summary coverage.info 2>&1; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: vitest-coverage
          path: coverage.info

  # The rest of Karma's runner browsers (.github/workflows/browser_testing.json), on the same runner OS
  # as their Karma jobs. Like Karma, only the default variant runs on these; real iOS Safari is vitest-browserstack below.
  vitest-browsers:
    name: Vitest ${{ matrix.browser }} (chunk ${{ matrix.chunk }})
    strategy:
      fail-fast: false
      matrix:
        chunk: [1, 2, 3, 4, 5, 6, 7, 8]
        browser: [Firefox, WebKit, Edge, Chrome 113]
        include:
          # Karma: FirefoxHeadless on ubuntu-latest
          - browser: Firefox
            runs-on: ubuntu-latest
            vitest-browser: firefox
            playwright: firefox
          # Karma: SafariNative on macos-latest. Playwright's WebKit is the closest thing it can drive.
          - browser: WebKit
            runs-on: macos-latest
            vitest-browser: webkit
            playwright: webkit
          # Karma: EdgeHeadless on windows-latest, which has Microsoft Edge installed
          - browser: Edge
            runs-on: windows-latest
            channel: msedge
          # Karma: "ChromeNoSandbox 113", the same binary from @puppeteer/browsers (see run-tests.yml)
          - browser: Chrome 113
            runs-on: ubuntu-latest
            chrome-version: 113.0.5672.0
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        if: ${{ matrix.playwright }}
        run: npx playwright install --with-deps ${{ matrix.playwright }}
      - name: Install Chrome ${{ matrix.chrome-version }}
        if: ${{ matrix.chrome-version }}
        env:
          CHROME_VERSION: ${{ matrix.chrome-version }}
        run: |
          out=($(npx @puppeteer/browsers install "chrome@$CHROME_VERSION"))
          echo "VITEST_EXECUTABLE_PATH=${out[1]}" >> "$GITHUB_ENV"
      - name: Precompile
        run: npx gulp precompile
      - name: Build and run chunk ${{ matrix.chunk }}
        env:
          TEST_CHUNKS: '8'
          TEST_CHUNK: ${{ matrix.chunk }}
          VITEST_BROWSER: ${{ matrix.vitest-browser }}
          VITEST_CHANNEL: ${{ matrix.channel }}
        run: npm run test:vitest

  # Karma's "Browserstack tests" job runs browsers.json minus what GitHub runners cover, which leaves desktop
  # Safari 16.5, standing in for the WebKit floor browserslist resolves to (ios_saf 16.6) because
  # karma-browserstack-launcher can't drive real iOS devices. This runs the same bundles on a real iPhone on
  # iOS 16 through @vitest/browser-webdriverio and BrowserStack Local (#16006). Fork PRs get no BrowserStack
  # secrets, so the job only runs when they are available.
  browserstack-check:
    name: Check for BrowserStack credentials
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          BROWSERSTACK_USER_NAME: ${{ secrets.BROWSERSTACK_USER_NAME }}
        run: echo "available=${BROWSERSTACK_USER_NAME:+true}" >> "$GITHUB_OUTPUT"

  vitest-browserstack:
    name: Vitest BrowserStack ${{ matrix.device }} iOS ${{ matrix.os-version }} (chunk ${{ matrix.chunk }})
    needs: browserstack-check
    if: ${{ needs.browserstack-check.outputs.available == 'true' }}
    strategy:
      fail-fast: false
      # One BrowserStack session per chunk, one chunk at a time, as Karma's BrowserStack job does
      # (run-tests.yml), so this job never holds more than one of the account's parallel sessions.
      max-parallel: 1
      matrix:
        chunk: [1, 2, 3, 4, 5, 6, 7, 8]
        device: [iPhone 14]
        os-version: ['16']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: npm ci
      - name: Restore precompile and babel caches
        uses: actions/cache@v5
        with:
          path: |
            .cache/precompile
            .cache/ts
            .cache/babel-loader
          key: vitest-default-${{ matrix.chunk }}-${{ hashFiles('package-lock.json', 'babelConfig.js', 'plugins/**', 'gulp.precompilation.js', 'gulpHelpers.js', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            vitest-default-${{ matrix.chunk }}-${{ hashFiles('package-lock.json', 'babelConfig.js', 'plugins/**', 'gulp.precompilation.js', 'gulpHelpers.js', 'tsconfig.json') }}-
      - name: Precompile
        run: npx gulp precompile
      - name: BrowserStack env setup
        uses: browserstack/github-actions/setup-env@1fad39ae4755588f7fc6854da6c3efba2bf5d08f # v1.0.6
        with:
          username: ${{ secrets.BROWSERSTACK_USER_NAME }}
          access-key: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          build-name: Vitest run ${{ github.run_id }}, attempt ${{ github.run_attempt }}, chunk ${{ matrix.chunk }}, ${{ github.ref }}
      - name: BrowserStack Local setup
        uses: browserstack/github-actions/setup-local@1fad39ae4755588f7fc6854da6c3efba2bf5d08f # v1.0.6
        with:
          local-testing: start
          local-identifier: random
      # Leaves at least one session free for Karma's BrowserStack job and the ES5 e2e job.
      - name: Wait for BrowserStack
        uses: ./.github/actions/wait-for-browserstack
        with:
          sessions: 2
      - name: Build and run chunk ${{ matrix.chunk }}
        timeout-minutes: 15
        env:
          TEST_CHUNKS: '8'
          TEST_CHUNK: ${{ matrix.chunk }}
          VITEST_BROWSERSTACK: '1'
          VITEST_BROWSER: safari
          VITEST_DEVICE: ${{ matrix.device }}
          VITEST_OS_VERSION: ${{ matrix.os-version }}
        run: npm run test:vitest
      - name: BrowserStack Local stop
        if: ${{ always() }}
        uses: browserstack/github-actions/setup-local@1fad39ae4755588f7fc6854da6c3efba2bf5d08f # v1.0.6
        with:
          local-testing: stop
