# GitHub-hosted CPU-only, local-model review. No external LLM provider/API key.
# The runner downloads Ollama and open weights, then performs inference on loopback.
# pull_request_target: never check out or execute untrusted PR code with a write token.
# The pinned Alibaba action checks out the trusted base and reads PR Git objects.
name: OpenCodeReview PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: open-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Only the ci/ocr-agent-* branch prefix opts in to the full agent.
    if: ${{ startsWith(github.event.pull_request.head.ref, 'ci/ocr-agent-') }}
    name: Experimental OpenCodeReview (Qwen3.5 9B)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OCR_EXPERIMENT: 'true'
      OCR_MODEL: qwen3.5:9b-q4_K_M

    steps:
      - name: Set runner-writable npm installation prefix
        run: |
          # runner.temp is only available in steps, not in job-level env.
          # Export the prefix and PATH for later steps and the composite action.
          npm_prefix="$RUNNER_TEMP/ocr-npm"
          mkdir -p "$npm_prefix/bin"
          echo "NPM_CONFIG_PREFIX=$npm_prefix" >> "$GITHUB_ENV"
          echo "$npm_prefix/bin" >> "$GITHUB_PATH"
      - name: Install Ollama v0.40.13
        env:
          OLLAMA_VERSION: '0.40.13'
        run: |
          # Verify the pinned upstream release installer before running it.
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/ollama-install.sh" \
            https://github.com/ollama/ollama/releases/download/v0.40.13/install.sh
          echo "25f64b810b947145095956533e1bdf56eacea2673c55a7e586be4515fc882c9f  $RUNNER_TEMP/ollama-install.sh" | sha256sum --check
          sh "$RUNNER_TEMP/ollama-install.sh"
          ollama --version

      - name: Start local Ollama and download review model
        env:
          OLLAMA_HOST: '127.0.0.1:11434'
          OLLAMA_NO_CLOUD: '1'
          OLLAMA_NUM_PARALLEL: '1'
          OLLAMA_MAX_LOADED_MODELS: '1'
          OLLAMA_CONTEXT_LENGTH: '16384'
          OLLAMA_KEEP_ALIVE: '-1'
        run: |
          # The installer may start a systemd service without our local-only
          # environment. Stop it and launch a loopback-only server ourselves.
          sudo systemctl stop ollama 2>/dev/null || true
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags > /dev/null; then
              break
            fi
            sleep 2
          done
          if ! curl --fail --silent http://127.0.0.1:11434/api/tags > /dev/null; then
            tail -n 100 "$RUNNER_TEMP/ollama.log"
            exit 1
          fi

          # Experimental only: Qwen3.5 9B; bounded review owns ordinary PRs.
          ollama pull "$OCR_MODEL"

          # This preflight uses the real OCR tool schemas, not a toy report_bug tool.
          # Fail before launching a long review if the model cannot emit structured calls.
          curl --fail --silent --show-error --max-time 180 \
            https://raw.githubusercontent.com/alibaba/open-code-review/375f64cd6f67a48a135da83cfcf59c52669a09cb/internal/config/toolsconfig/tools.json \
            --output "$RUNNER_TEMP/ocr-tools.json"
          jq -n --slurpfile defs "$RUNNER_TEMP/ocr-tools.json" \
            --arg model "$OCR_MODEL" \
            --argjson experimental "$OCR_EXPERIMENT" \
            '{
              model: $model,
              messages: [
                {role:"system", content:"Review the code. Use code_comment to report the exact defective line; then call task_done when finished."},
                {role:"user", content:"In src/ocrQwen35SmokeTest.ts: export function inWindow(now:number,start:number,end:number){return now>=start || now<=end;} Report the error with code_comment."}
              ],
              tools: ($defs[0] | map(select(.name == "code_comment" or .name == "task_done") | {type:"function",function:.definition})),
              tool_choice:"required",
              max_tokens:1024,
              stream:false
            } + (if $experimental then {reasoning_effort:"none"} else {} end)' \
            > "$RUNNER_TEMP/ocr-tool-preflight.json"
          curl --fail --silent --show-error --max-time 180 \
            http://127.0.0.1:11434/v1/chat/completions \
            --header 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/ocr-tool-preflight.json" \
            > "$RUNNER_TEMP/ocr-tool-preflight-response.json"
          if ! jq --exit-status '
            [.choices[0].message.tool_calls[]? | select(.function.name == "code_comment")
             | .function.arguments | fromjson? | .comments[]? |
             select(.existing_code | contains("||"))] | length > 0
          ' "$RUNNER_TEMP/ocr-tool-preflight-response.json"; then
            echo "::error::Model failed the realistic OCR code_comment preflight."
            jq '{calls:[.choices[0].message.tool_calls[]? | {name:.function.name,arguments:.function.arguments}],content:(.choices[0].message.content // "" | .[0:600])}' "$RUNNER_TEMP/ocr-tool-preflight-response.json"
            exit 1
          fi
          echo "Verified native OCR code_comment call on the deliberate boolean bug."

      - name: Bound individual review prompts to model context
        run: |
          # max_tokens_budget below limits the whole review, not an individual
          # prompt. OCR otherwise defaults to a 200K-token input prompt.
          # Reserve half of Ollama's 16K context for generation, tool calls,
          # and tokenization differences on a small local model.
          # The pinned action subsequently configures the same CLI and does
          # not overwrite this persisted max_tokens setting.
          npm install -g @alibaba-group/open-code-review@1.13.3
          ocr config set max_tokens 8192
          jq --exit-status '.max_tokens == 8192' "$HOME/.opencodereview/config.json"

      - name: Review PR and publish comments
        # OpenCodeReview v1.13.3 (the action and installed CLI are both pinned).
        uses: alibaba/open-code-review@375f64cd6f67a48a135da83cfcf59c52669a09cb
        with:
          llm_url: http://127.0.0.1:11434/v1
          llm_auth_token: ollama
          llm_model: ${{ env.OCR_MODEL }}
          llm_use_anthropic: 'false'
          llm_protocol: openai
          # Default OCR extra_body targets other providers' thinking formats.
          llm_extra_body: '{"reasoning_effort":"none"}'
          ocr_version: '1.13.3'
          language: English
          rule: .opencodereview/rule.json
          # CPU runner: do not generate multiple competing model requests.
          review_concurrency: '1'
          effort: low
          # Publish agent progress to the Actions log during long CPU reviews.
          stream_progress: 'true'
          llm_timeout: '180'
          review_task_timeout: '7'
          # Leave the whole-run budget unlimited: OCR estimates even a tiny
          # review group at >16K tokens before making its first model call.
          # The 8,192-token per-prompt ceiling above still limits context.
          sticky_summary: 'true'
          incremental: 'true'
          # Keep minor feedback in the summary instead of numerous inline threads.
          route_severity_below: low
          route_categories: style,documentation

      - name: Upload OCR preflight diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ocr-9b-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ocr-tool-preflight-response.json
            ${{ runner.temp }}/ollama.log
          if-no-files-found: ignore
