# GitHub-hosted CPU-only, local-model review. No external LLM provider/API key.
# The runner downloads Ollama and open weights, then performs inference on loopback.
# pull_request_target: never check out or execute untrusted PR code with a write token.
# The pinned Alibaba action checks out the trusted base and reads PR Git objects.
name: OpenCodeReview PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: open-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI code review (local Qwen3 4B)
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Set runner-writable npm installation prefix
        run: |
          # runner.temp is only available in steps, not in job-level env.
          # Export the prefix and PATH for later steps and the composite action.
          npm_prefix="$RUNNER_TEMP/ocr-npm"
          mkdir -p "$npm_prefix/bin"
          echo "NPM_CONFIG_PREFIX=$npm_prefix" >> "$GITHUB_ENV"
          echo "$npm_prefix/bin" >> "$GITHUB_PATH"
      - name: Install Ollama v0.40.13
        env:
          OLLAMA_VERSION: '0.40.13'
        run: |
          # Verify the pinned upstream release installer before running it.
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/ollama-install.sh" \
            https://github.com/ollama/ollama/releases/download/v0.40.13/install.sh
          echo "25f64b810b947145095956533e1bdf56eacea2673c55a7e586be4515fc882c9f  $RUNNER_TEMP/ollama-install.sh" | sha256sum --check
          sh "$RUNNER_TEMP/ollama-install.sh"
          ollama --version

      - name: Start local Ollama and download Qwen3 4B
        env:
          OLLAMA_HOST: '127.0.0.1:11434'
          OLLAMA_NO_CLOUD: '1'
          OLLAMA_NUM_PARALLEL: '1'
          OLLAMA_MAX_LOADED_MODELS: '1'
          OLLAMA_CONTEXT_LENGTH: '16384'
          OLLAMA_KEEP_ALIVE: '-1'
        run: |
          # The installer may start a systemd service without our local-only
          # environment. Stop it and launch a loopback-only server ourselves.
          sudo systemctl stop ollama 2>/dev/null || true
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags > /dev/null; then
              break
            fi
            sleep 2
          done
          if ! curl --fail --silent http://127.0.0.1:11434/api/tags > /dev/null; then
            tail -n 100 "$RUNNER_TEMP/ollama.log"
            exit 1
          fi

          # Non-thinking, instruction-tuned, tool-calling model (~2.5 GB Q4).
          ollama pull qwen3:4b-instruct-2507-q4_K_M

          # OCR requires *structured* tool calls, not mentions of tools in prose.
          curl --fail --silent --show-error --max-time 900 \
            http://127.0.0.1:11434/v1/chat/completions \
            --header 'Content-Type: application/json' \
            --data '{
              "model": "qwen3:4b-instruct-2507-q4_K_M",
              "messages": [{"role": "user", "content": "Call report_bug to report the bug in function add(a,b) { return a-b; }."}],
              "tools": [{"type": "function", "function": {
                "name": "report_bug",
                "description": "Report a bug",
                "parameters": {"type": "object", "properties": {"description": {"type": "string"}}, "required": ["description"]}
              }}],
              "max_tokens": 256,
              "stream": false
            }' > "$RUNNER_TEMP/ollama-tool-test.json"
          if ! jq --exit-status '((.choices[0].message.tool_calls // []) | length) > 0' "$RUNNER_TEMP/ollama-tool-test.json"; then
            echo "::error::Local model did not produce native function/tool calls."
            cat "$RUNNER_TEMP/ollama-tool-test.json"
            exit 1
          fi

      - name: Bound individual review prompts to model context
        run: |
          # max_tokens_budget below limits the whole review, not an individual
          # prompt. OCR otherwise defaults to a 200K-token input prompt.
          # Reserve half of Ollama's 16K context for generation, tool calls,
          # and tokenization differences on a small local model.
          # The pinned action subsequently configures the same CLI and does
          # not overwrite this persisted max_tokens setting.
          npm install -g @alibaba-group/open-code-review@1.13.3
          ocr config set max_tokens 8192
          jq --exit-status '.max_tokens == 8192' "$HOME/.opencodereview/config.json"

      - name: Review PR and publish comments
        # OpenCodeReview v1.13.3 (the action and installed CLI are both pinned).
        uses: alibaba/open-code-review@375f64cd6f67a48a135da83cfcf59c52669a09cb
        with:
          llm_url: http://127.0.0.1:11434/v1
          llm_auth_token: ollama
          llm_model: qwen3:4b-instruct-2507-q4_K_M
          llm_use_anthropic: 'false'
          llm_protocol: openai
          # Default OCR extra_body targets other providers' thinking formats.
          llm_extra_body: '{}'
          ocr_version: '1.13.3'
          language: English
          # CPU runner: do not generate multiple competing model requests.
          review_concurrency: '1'
          effort: low
          llm_timeout: '900'
          review_task_timeout: '35'
          # Leave the whole-run budget unlimited: OCR estimates even a tiny
          # review group at >16K tokens before making its first model call.
          # The 8,192-token per-prompt ceiling above still limits context.
          sticky_summary: 'true'
          incremental: 'true'
          # Keep minor feedback in the summary instead of numerous inline threads.
          route_severity_below: low
          route_categories: style,documentation
