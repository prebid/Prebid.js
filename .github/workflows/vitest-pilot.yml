name: Vitest browser pilot (non-blocking experiment)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'test/vitest/**'
      - '.github/workflows/vitest-pilot.yml'

permissions:
  contents: read

jobs:
  vitest-browser-pilot:
    name: Two existing specs in Vitest / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Install Prebid dependencies
        run: npm ci
      - name: Install isolated Vitest pilot dependencies
        run: npm install --prefix test/vitest --no-package-lock --no-audit --no-fund
      - name: Install browser
        run: ./test/vitest/node_modules/.bin/playwright install --with-deps chromium
      - name: Precompile tests and source (same pipeline as Karma)
        run: npx gulp precompile-all-features-disabled
      - name: Run existing tests in Vitest Browser Mode
        run: ./test/vitest/node_modules/.bin/vitest run --config test/vitest/vitest.config.mjs
