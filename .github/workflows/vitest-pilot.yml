name: Vitest browser pilot (non-blocking experiment)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'test/vitest/**'
      - '.github/workflows/vitest-pilot.yml'

permissions:
  contents: read

jobs:
  vitest-browser-pilot:
    name: Vitest Chromium (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        mode: [isolated, shared, shared-stress, core-isolated, core-shared]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: npm ci
      - name: Verify Vitest module resolution
        run: node --input-type=module -e "console.log(import.meta.resolve('vitest/config')); console.log(import.meta.resolve('@vitest/browser-playwright'))"
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Precompile tests and source
        run: npx gulp precompile-all-features-disabled
      - name: Run existing tests in Vitest Browser Mode
        if: ${{ matrix.mode == 'isolated' || matrix.mode == 'shared' }}
        run: ${{ matrix.mode == 'isolated' && 'npm run test:vitest' || 'npm run test:vitest -- --no-isolate' }}
      - name: Run src core specs (bounded diagnostic)
        if: ${{ matrix.mode == 'core-isolated' || matrix.mode == 'core-shared' }}
        env:
          VITEST_CORE: '1'
        run: ${{ matrix.mode == 'core-shared' && 'timeout --signal=TERM --kill-after=10s 180s npm run test:vitest -- --no-isolate --bail=1' || 'timeout --signal=TERM --kill-after=10s 180s npm run test:vitest -- --bail=1' }}
      # Diagnostic run: the initial stress test hit many failures, then
      # stayed alive until GitHub cancelled it. Bail early to capture the
      # first actionable stack trace and cap pathological cleanup hangs.
      - name: Diagnose first shared-stress failure (bounded)
        if: ${{ matrix.mode == 'shared-stress' }}
        env:
          VITEST_STRESS: '1'
        run: timeout --signal=TERM --kill-after=10s 180s npm run test:vitest -- --no-isolate --bail=1
