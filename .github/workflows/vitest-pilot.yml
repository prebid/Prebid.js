name: Vitest browser pilot (non-blocking experiment)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'test/vitest/**'
      - '.github/workflows/vitest-pilot.yml'

permissions:
  contents: read

jobs:
  vitest-browser-pilot:
    name: Two existing specs in Vitest / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Install Prebid dependencies
        run: npm ci
      # The Vite browser server resolves modules from the repository root,
      # so install the pilot tools into root node_modules for this job only.
      # --no-save and --no-package-lock leave package.json / package-lock.json unchanged.
      - name: Install trial Vitest and Playwright in root node_modules
        run: npm install --no-save --no-package-lock --no-audit --no-fund vitest@4.1.12 @vitest/browser-playwright@4.1.12 playwright@1.64.1
      - name: Verify root Vitest module resolution
        run: node --input-type=module -e "console.log(import.meta.resolve('vitest/config')); console.log(import.meta.resolve('@vitest/browser-playwright'))"
      - name: Install browser
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Precompile tests and source (same pipeline as Karma)
        run: npx gulp precompile-all-features-disabled
      - name: Run existing tests in Vitest Browser Mode
        run: ./node_modules/.bin/vitest run --config test/vitest/vitest.config.mjs
