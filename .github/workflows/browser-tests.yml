name: Build checks and e2e tests on all browsers
# Unit tests run under Vitest (vitest-tests.yml, #16007); Karma's unit and BrowserStack jobs were here.
on:
  workflow_call:
    inputs:
      source-key:
        type: string
        default: 'source'
        required: false
    secrets:
      BROWSERSTACK_USER_NAME:
        description: "Browserstack user name"
      BROWSERSTACK_ACCESS_KEY:
        description: "Browserstack access key"
jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      build-cmd: npx gulp build
      source-key: ${{ inputs.source-key }}
      windows: true
      macos: true

  setup:
    needs: build
    name: "Define testing strategy"
    runs-on: ubuntu-latest
    outputs:
      e2eBrowsers: ${{ toJSON(fromJSON(steps.define.outputs.result).e2eBrowsers) }}
      latestBrowsers: ${{ toJSON(fromJSON(steps.define.outputs.result).latestBrowsers) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name:  Restore working directory
        uses: ./.github/actions/load
        with:
          name: ${{ needs.build.outputs.linux }}
      - name: "Define testing strategy"
        uses: actions/github-script@v9
        id: define
        with:
          script: |
            const browsers = Object.entries(
              require('./.github/workflows/browser_testing.json')
            ).flatMap(([name, browser]) => {
              browser = Object.assign({name, version: 'latest'}, browser);
              const browsers = [browser];
              const versions = browser.versions;
              if (versions) {
                 delete browser.versions;
                 browsers.push(...Object.entries(versions).map(([version, def]) => Object.assign({}, browser, {version, ...def})))
              }
              return browsers;
            }).map(browser => {
             browser.os = browser.runsOn?.startsWith('windows') ? 'windows'
               : browser.runsOn?.startsWith('macos') ? 'macos'
                 : 'linux'
             return browser;
            });
            const e2eBrowsers = browsers.filter(browser => browser.wdioName != null);
            console.log("Browsers to be tested directly on runners:", JSON.stringify({e2eBrowsers}, null, 2))
            return {
              e2eBrowsers,
              latestBrowsers: browsers.filter(browser => browser.version === 'latest')
            }

  test-build-logic:
    needs: build
    name: "Test build logic"
    uses:
      ./.github/workflows/run-tests.yml
    with:
      built-key: ${{ needs.build.outputs.linux }}
      test-cmd: gulp test-build-logic

  ts-consumer-packed:
    needs: build
    name: "Type check the packed NPM package"
    uses:
      ./.github/workflows/run-tests.yml
    with:
      built-key: ${{ needs.build.outputs.linux }}
      test-cmd: npx gulp ts-consumer-packed

  e2e-tests:
    needs: [setup, build]
    name: "E2E (browser: ${{ matrix.browser.wdioName }} ${{ matrix.browser.version }})"
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(needs.setup.outputs.e2eBrowsers) }}
    uses:
      ./.github/workflows/run-tests.yml
    with:
      browser: ${{ matrix.browser.wdioName }}
      built-key: ${{ needs.build.outputs[matrix.browser.os] }}
      test-cmd: npx gulp e2e-test-nobuild --local
      chunks: 1
      runs-on: ${{ matrix.browser.runsOn || 'ubuntu-latest' }}
      configure-safari: ${{ matrix.browser.os == 'macos' }}
      browserstack: false
