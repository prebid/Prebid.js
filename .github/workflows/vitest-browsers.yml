name: Vitest unit tests (browsers)

# Stage 2 of the unit test gate (#16007), called from test.yml once the Chromium stage (vitest-chromium.yml) has
# passed: Firefox, Safari (macOS, the real browser through safaridriver), Edge (Windows) and Chrome 113, in shards
# (Vitest's `--shard`, 3 pages at once), and a real iPhone on iOS 16 through BrowserStack where the secrets are
# available (not on fork PRs, as with Karma's BrowserStack job; their changes are tested there by the master run
# after merge). See test/vitest/README.md, "CI".
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to test (default the triggering ref)
        type: string
        default: ''
        required: false
    secrets:
      BROWSERSTACK_USER_NAME:
        description: BrowserStack user name
      BROWSERSTACK_ACCESS_KEY:
        description: BrowserStack access key

permissions:
  contents: read

jobs:

  # The rest of Karma's runner browsers (browser_testing.json), on the same runner OS as their Karma jobs.
  # Like Karma, only the default variant runs on these.
  # The rest of Karma's runner browsers (browser_testing.json), on the same runner OS as their Karma jobs, default
  # variant only. Each job runs its share of the specs (Vitest's `--shard`) with 3 pages at once. Shard counts
  # follow each browser's speed: about two minutes of tests per job.
  browsers:
    name: Vitest ${{ matrix.browser }} (shard ${{ matrix.shard }}/${{ matrix.shards }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Karma: FirefoxHeadless on ubuntu-latest. The slowest per spec, so 2 shards.
          - browser: Firefox
            shard: 1
            shards: 2
            runs-on: ubuntu-latest
            vitest-browser: firefox
            playwright: firefox
          - browser: Firefox
            shard: 2
            shards: 2
            runs-on: ubuntu-latest
            vitest-browser: firefox
            playwright: firefox
          # Karma: SafariNative on macos-latest. The same installed Safari, through safaridriver.
          - browser: Safari
            shard: 1
            shards: 2
            runs-on: macos-latest
            vitest-browser: safari
            safari: true
          - browser: Safari
            shard: 2
            shards: 2
            runs-on: macos-latest
            vitest-browser: safari
            safari: true
          # Karma: EdgeHeadless on windows-latest, which has Microsoft Edge installed
          - browser: Edge
            shard: 1
            shards: 1
            runs-on: windows-latest
            channel: msedge
          # Karma: "ChromeNoSandbox 113", the same binary from @puppeteer/browsers
          - browser: Chrome 113
            shard: 1
            shards: 1
            runs-on: ubuntu-latest
            chrome-version: 113.0.5672.0
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      VITEST_PARALLEL: '3'
      VITEST_BROWSER: ${{ matrix.vitest-browser }}
      VITEST_CHANNEL: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # sets up Node and restores node_modules (about 10s) in place of npm ci (about 70s)
      - name: Install dependencies
        uses: ./.github/actions/npm-ci
      - name: Install browser
        if: ${{ matrix.playwright }}
        run: npx playwright install --with-deps ${{ matrix.playwright }}
      - name: Install Chrome ${{ matrix.chrome-version }}
        if: ${{ matrix.chrome-version }}
        env:
          CHROME_VERSION: ${{ matrix.chrome-version }}
        run: |
          out=($(npx @puppeteer/browsers install "chrome@$CHROME_VERSION"))
          echo "VITEST_EXECUTABLE_PATH=${out[1]}" >> "$GITHUB_ENV"
      # as Karma's "Configure Safari" step (run-tests.yml)
      - name: Configure Safari
        if: ${{ matrix.safari }}
        run: |
          defaults write com.apple.Safari IncludeDevelopMenu YES
          defaults write com.apple.Safari AllowRemoteAutomation 1
          sudo safaridriver --enable
      # what the Chromium stage's default variant just saved; Linux only, since the caches hold Linux paths
      - name: Restore precompile and babel caches
        if: ${{ runner.os == 'Linux' }}
        uses: actions/cache/restore@v5
        with:
          path: |
            .cache/precompile
            .cache/ts
            .cache/babel-loader
          key: vitest-default-${{ hashFiles('package-lock.json', 'babelConfig.js', 'plugins/**', 'gulp.precompilation.js', 'gulpHelpers.js', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            vitest-default-${{ hashFiles('package-lock.json', 'babelConfig.js', 'plugins/**', 'gulp.precompilation.js', 'gulpHelpers.js', 'tsconfig.json') }}-
      - name: Precompile
        run: npx gulp precompile
      - name: Run specs, shard ${{ matrix.shard }} of ${{ matrix.shards }}
        run: npm run test:vitest -- --shard=${{ matrix.shard }}/${{ matrix.shards }}


  # Safari on a real iPhone on iOS 16, the WebKit floor browserslist resolves to (ios_saf 16.6), through
  # @vitest/browser-webdriverio and BrowserStack Local (#16006). Karma's BrowserStack job ran desktop Safari
  # 16.5 in its place, because karma-browserstack-launcher can't drive real iOS devices.
  browserstack-check:
    name: Check for BrowserStack credentials
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          BROWSERSTACK_USER_NAME: ${{ secrets.BROWSERSTACK_USER_NAME }}
        run: echo "available=${BROWSERSTACK_USER_NAME:+true}" >> "$GITHUB_OUTPUT"


  browserstack:
    name: Vitest BrowserStack ${{ matrix.device }} iOS ${{ matrix.os-version }} (shard ${{ matrix.shard }}/2)
    needs: browserstack-check
    if: ${{ needs.browserstack-check.outputs.available == 'true' }}
    strategy:
      fail-fast: false
      # One BrowserStack session per shard, one shard at a time, so this job never holds more than one of the
      # account's parallel sessions. A session ends after 300s without WebDriver traffic, which a test run sends
      # none of, so each shard has to finish within that: 2 shards, with 3 pages at once.
      max-parallel: 1
      matrix:
        shard: [1, 2]
        device: [iPhone 14]
        os-version: ['16']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # sets up Node and restores node_modules (about 10s) in place of npm ci (about 70s)
      - name: Install dependencies
        uses: ./.github/actions/npm-ci
      - name: Restore precompile and babel caches
        uses: actions/cache@v5
        with:
          path: |
            .cache/precompile
            .cache/ts
            .cache/babel-loader
          key: vitest-default-${{ hashFiles('package-lock.json', 'babelConfig.js', 'plugins/**', 'gulp.precompilation.js', 'gulpHelpers.js', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            vitest-default-${{ hashFiles('package-lock.json', 'babelConfig.js', 'plugins/**', 'gulp.precompilation.js', 'gulpHelpers.js', 'tsconfig.json') }}-
      - name: Precompile
        run: npx gulp precompile
      - name: BrowserStack env setup
        uses: browserstack/github-actions/setup-env@1fad39ae4755588f7fc6854da6c3efba2bf5d08f # v1.0.6
        with:
          username: ${{ secrets.BROWSERSTACK_USER_NAME }}
          access-key: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          build-name: Vitest run ${{ github.run_id }}, attempt ${{ github.run_attempt }}, shard ${{ matrix.shard }}, ${{ github.ref }}
      - name: BrowserStack Local setup
        uses: browserstack/github-actions/setup-local@1fad39ae4755588f7fc6854da6c3efba2bf5d08f # v1.0.6
        with:
          local-testing: start
          local-identifier: random
      # Leaves at least one session free for the ES5 e2e job (test.yml).
      - name: Wait for BrowserStack
        uses: ./.github/actions/wait-for-browserstack
        with:
          sessions: 2
      - name: Run specs, shard ${{ matrix.shard }} of 2
        timeout-minutes: 15
        env:
          VITEST_BROWSERSTACK: '1'
          VITEST_PARALLEL: '3'
          VITEST_BROWSER: safari
          VITEST_DEVICE: ${{ matrix.device }}
          VITEST_OS_VERSION: ${{ matrix.os-version }}
        run: npm run test:vitest -- --shard=${{ matrix.shard }}/2
      - name: BrowserStack Local stop
        if: ${{ always() }}
        uses: browserstack/github-actions/setup-local@1fad39ae4755588f7fc6854da6c3efba2bf5d08f # v1.0.6
        with:
          local-testing: stop
