name: Vitest unit tests

# The unit test gate (#16007): every spec under Vitest Browser Mode, in Karma's 8 chunks. Each chunk runs most
# specs as native ES modules served by Vite (test/vitest-native) and the rest bundled by Karma's webpack/Babel
# config (test/vitest-webpack); see test/vitest-webpack/README.md. Called from test.yml.
#
# Browsers, as Karma's browser_testing.json and BrowserStack jobs had them:
#   Chromium, default and all-features-disabled builds, with coverage from the default build
#   Firefox (ubuntu), Safari (macOS, the real browser through safaridriver), Edge (windows), Chrome 113
#   a real iPhone on iOS 16 through BrowserStack, where the BrowserStack secrets are available (not on fork
#   PRs, as with Karma's BrowserStack job; their changes are tested there by the master run after merge)
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to test (default the triggering ref)
        type: string
        default: ''
        required: false
      coverage-only:
        description: Only run the coverage build (Chromium, default variant), e.g. for the base branch
        type: boolean
        default: false
        required: false
    outputs:
      coverage:
        description: Name of the artifact holding the combined lcov file (coverage.info)
        value: ${{ jobs.coverage.outputs.artifact }}
    secrets:
      BROWSERSTACK_USER_NAME:
        description: BrowserStack user name
      BROWSERSTACK_ACCESS_KEY:
        description: BrowserStack access key

permissions:
  contents: read

jobs:
  chromium:
    name: Vitest Chromium (${{ matrix.variant }}, chunk ${{ matrix.chunk }})
    strategy:
      fail-fast: false
      matrix:
        chunk: [1, 2, 3, 4, 5, 6, 7, 8]
        # Like Karma's "Unit tests (all features disabled)" job: the variant is whatever tree the precompile
        # step leaves in dist/src. Coverage comes from the default variant, as it did with Karma.
        variant: ${{ fromJSON(inputs.coverage-only && '["default"]' || '["default", "all-features-disabled"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Base coverage is informational: a base commit that can't produce it (one from before Vitest) leaves
    # the coverage output empty instead of failing the run, and test.yml then skips the comparison.
    continue-on-error: ${{ inputs.coverage-only }}
    env:
      TEST_CHUNKS: '8'
      TEST_CHUNK: ${{ matrix.chunk }}
      VITEST_COVERAGE: ${{ matrix.variant == 'default' && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: npm ci
      # ubuntu-latest already has the system libraries Chromium needs (it ships Google Chrome); --with-deps
      # would add an apt-get run of 10s or more, occasionally minutes, to every job.
      - name: Install browser
        run: npx playwright install chromium
      # Restored, these caches take about half off precompile and webpack time (#16009). They are keyed on
      # each source file's contents, but not on the build system itself (see gulp.precompilation.js): a
      # change to the Babel config, the local Babel plugins, the precompile code or the dependencies would
      # otherwise reuse stale output. Those files are hashed into the key, so such a change starts empty.
      - name: Restore precompile and babel caches
        uses: actions/cache@v5
        with:
          path: |
            .cache/precompile
            .cache/ts
            .cache/babel-loader
          key: vitest-${{ matrix.variant }}-${{ matrix.chunk }}-${{ hashFiles('package-lock.json', 'babelConfig.js', 'plugins/**', 'gulp.precompilation.js', 'gulpHelpers.js', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            vitest-${{ matrix.variant }}-${{ matrix.chunk }}-${{ hashFiles('package-lock.json', 'babelConfig.js', 'plugins/**', 'gulp.precompilation.js', 'gulpHelpers.js', 'tsconfig.json') }}-
      - name: Precompile (${{ matrix.variant }})
        run: npx gulp ${{ matrix.variant == 'default' && 'precompile' || 'precompile-all-features-disabled' }}
      - name: Build and run chunk ${{ matrix.chunk }} (webpack bridge)
        run: npm run test:vitest
      - name: Run chunk ${{ matrix.chunk }} (native)
        if: ${{ !cancelled() }}
        run: npm run test:vitest-native
      - name: Upload coverage
        if: ${{ matrix.variant == 'default' && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: vitest-coverage-${{ github.run_id }}-${{ inputs.coverage-only && 'base' || 'head' }}-${{ matrix.chunk }}
          # build/coverage/chunks/<chunk>/lcov.info from the bridge (the layout Karma's coverage jobs produced);
          # build/coverage/chunks/native/<chunk>/lcov.info from the native project
          path: build/coverage/chunks
          if-no-files-found: error

  # Combines the chunks the way .github/actions/combine-coverage does, into one lcov file for test.yml.
  coverage:
    name: Vitest coverage
    needs: [chromium]
    if: ${{ !cancelled() }}
    continue-on-error: ${{ inputs.coverage-only }}
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: vitest-coverage-${{ github.run_id }}-${{ inputs.coverage-only && 'base' || 'head' }}-*
          path: build/coverage/chunks
          merge-multiple: true
      - name: Combine coverage results
        run: |
          # a chunk that failed before writing coverage would otherwise leave a plausible but partial total.
          # Every chunk has native specs; the bridge only writes a report for a chunk with bridge specs in it.
          for chunk in 1 2 3 4 5 6 7 8; do
            if [ ! -s "build/coverage/chunks/native/$chunk/lcov.info" ]; then
              echo "::error::No coverage for chunk $chunk; not combining a partial result"
              exit 1
            fi
          done
          sudo apt-get update
          sudo apt-get install lcov -y
          find build/coverage/chunks -name 'lcov.info' -printf ' -a %p' | xargs lcov -o coverage.info
          { echo '### Vitest coverage'; echo '```'; lcov --summary coverage.info 2>&1; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - id: name
        run: echo "artifact=vitest-coverage-${{ github.run_id }}-${{ inputs.coverage-only && 'base' || 'head' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: coverage.info

  # The rest of Karma's runner browsers (browser_testing.json), on the same runner OS as their Karma jobs.
  # Like Karma, only the default variant runs on these.
  browsers:
    name: Vitest ${{ matrix.browser }} (chunk ${{ matrix.chunk }})
    if: ${{ !inputs.coverage-only }}
    strategy:
      fail-fast: false
      matrix:
        chunk: [1, 2, 3, 4, 5, 6, 7, 8]
        browser: [Firefox, Safari, Edge, Chrome 113]
        include:
          # Karma: FirefoxHeadless on ubuntu-latest
          - browser: Firefox
            runs-on: ubuntu-latest
            vitest-browser: firefox
            playwright: firefox
          # Karma: SafariNative on macos-latest. The same installed Safari, through safaridriver.
          - browser: Safari
            runs-on: macos-latest
            vitest-browser: safari
            safari: true
          # Karma: EdgeHeadless on windows-latest, which has Microsoft Edge installed
          - browser: Edge
            runs-on: windows-latest
            channel: msedge
          # Karma: "ChromeNoSandbox 113", the same binary from @puppeteer/browsers
          - browser: Chrome 113
            runs-on: ubuntu-latest
            chrome-version: 113.0.5672.0
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      TEST_CHUNKS: '8'
      TEST_CHUNK: ${{ matrix.chunk }}
      VITEST_BROWSER: ${{ matrix.vitest-browser }}
      VITEST_CHANNEL: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        if: ${{ matrix.playwright }}
        run: npx playwright install --with-deps ${{ matrix.playwright }}
      - name: Install Chrome ${{ matrix.chrome-version }}
        if: ${{ matrix.chrome-version }}
        env:
          CHROME_VERSION: ${{ matrix.chrome-version }}
        run: |
          out=($(npx @puppeteer/browsers install "chrome@$CHROME_VERSION"))
          echo "VITEST_EXECUTABLE_PATH=${out[1]}" >> "$GITHUB_ENV"
      # as Karma's "Configure Safari" step (run-tests.yml)
      - name: Configure Safari
        if: ${{ matrix.safari }}
        run: |
          defaults write com.apple.Safari IncludeDevelopMenu YES
          defaults write com.apple.Safari AllowRemoteAutomation 1
          sudo safaridriver --enable
      - name: Precompile
        run: npx gulp precompile
      - name: Build and run chunk ${{ matrix.chunk }} (webpack bridge)
        run: npm run test:vitest
      - name: Run chunk ${{ matrix.chunk }} (native)
        if: ${{ !cancelled() }}
        run: npm run test:vitest-native

  # Safari on a real iPhone on iOS 16, the WebKit floor browserslist resolves to (ios_saf 16.6), through
  # @vitest/browser-webdriverio and BrowserStack Local (#16006). Karma's BrowserStack job ran desktop Safari
  # 16.5 in its place, because karma-browserstack-launcher can't drive real iOS devices.
  browserstack-check:
    name: Check for BrowserStack credentials
    if: ${{ !inputs.coverage-only }}
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          BROWSERSTACK_USER_NAME: ${{ secrets.BROWSERSTACK_USER_NAME }}
        run: echo "available=${BROWSERSTACK_USER_NAME:+true}" >> "$GITHUB_OUTPUT"

  browserstack:
    name: Vitest BrowserStack ${{ matrix.device }} iOS ${{ matrix.os-version }} (chunk ${{ matrix.chunk }})
    needs: browserstack-check
    if: ${{ needs.browserstack-check.outputs.available == 'true' }}
    strategy:
      fail-fast: false
      # One BrowserStack session per chunk, one chunk at a time, so this job never holds more than one of the
      # account's parallel sessions.
      max-parallel: 1
      matrix:
        chunk: [1, 2, 3, 4, 5, 6, 7, 8]
        device: [iPhone 14]
        os-version: ['16']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: npm ci
      - name: Restore precompile and babel caches
        uses: actions/cache@v5
        with:
          path: |
            .cache/precompile
            .cache/ts
            .cache/babel-loader
          key: vitest-default-${{ matrix.chunk }}-${{ hashFiles('package-lock.json', 'babelConfig.js', 'plugins/**', 'gulp.precompilation.js', 'gulpHelpers.js', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            vitest-default-${{ matrix.chunk }}-${{ hashFiles('package-lock.json', 'babelConfig.js', 'plugins/**', 'gulp.precompilation.js', 'gulpHelpers.js', 'tsconfig.json') }}-
      - name: Precompile
        run: npx gulp precompile
      - name: BrowserStack env setup
        uses: browserstack/github-actions/setup-env@1fad39ae4755588f7fc6854da6c3efba2bf5d08f # v1.0.6
        with:
          username: ${{ secrets.BROWSERSTACK_USER_NAME }}
          access-key: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          build-name: Vitest run ${{ github.run_id }}, attempt ${{ github.run_attempt }}, chunk ${{ matrix.chunk }}, ${{ github.ref }}
      - name: BrowserStack Local setup
        uses: browserstack/github-actions/setup-local@1fad39ae4755588f7fc6854da6c3efba2bf5d08f # v1.0.6
        with:
          local-testing: start
          local-identifier: random
      # Leaves at least one session free for the ES5 e2e job (test.yml).
      - name: Wait for BrowserStack
        uses: ./.github/actions/wait-for-browserstack
        with:
          sessions: 2
      - name: Build and run chunk ${{ matrix.chunk }}
        timeout-minutes: 15
        env:
          TEST_CHUNKS: '8'
          TEST_CHUNK: ${{ matrix.chunk }}
          VITEST_BROWSERSTACK: '1'
          # the complete suite through the bridge (test/vitest-webpack/README.md, "BrowserStack")
          VITEST_BRIDGE_ALL: '1'
          VITEST_BROWSER: safari
          VITEST_DEVICE: ${{ matrix.device }}
          VITEST_OS_VERSION: ${{ matrix.os-version }}
        run: npm run test:vitest
      - name: BrowserStack Local stop
        if: ${{ always() }}
        uses: browserstack/github-actions/setup-local@1fad39ae4755588f7fc6854da6c3efba2bf5d08f # v1.0.6
        with:
          local-testing: stop
