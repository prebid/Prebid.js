name: Prebid code scanner

on:
  # PRs: "PR info" runs on pull_request without secrets; this runs after it, from the base branch,
  # and scans the PR's files without executing them.
  workflow_run:
    workflows:
      - PR info
    types:
      - completed
  push:
    branches:
      - master
      - '*-legacy'

permissions:
  contents: read
  actions: read
  pull-requests: read
  security-events: write

jobs:
  scan:
    name: "Prebid code scanner"
    if: ${{ github.event_name == 'push' || (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (Push)
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Scan (Push)
        if: ${{ github.event_name == 'push' }}
        uses: prebid/code-scanner@main
        with:
          token: ${{ github.token }}
          pem: ${{ secrets.CODE_SCANNER_PEM }}
          appId: ${{ vars.CODE_SCANNER_APPID }}
          installationId: ${{ vars.CODE_SCANNER_INSTALLATION }}

      # The base branch is checked out first, so the local trusted-pr action is the base branch's own.
      - name: Checkout base branch (PR)
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Get PR
        if: ${{ github.event_name == 'workflow_run' }}
        id: pr
        uses: ./.github/actions/trusted-pr
      # Into a subdirectory, so nothing from the PR replaces the base branch's files. Its code is only read.
      - name: Checkout PR
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.sha }}
          path: pr
          persist-credentials: false
      - name: Scan (PR)
        if: ${{ github.event_name == 'workflow_run' }}
        uses: prebid/code-scanner@main
        with:
          token: ${{ github.token }}
          pem: ${{ secrets.CODE_SCANNER_PEM }}
          appId: ${{ vars.CODE_SCANNER_APPID }}
          installationId: ${{ vars.CODE_SCANNER_INSTALLATION }}
          root: pr
          pr: ${{ steps.pr.outputs.number }}
          sha: ${{ steps.pr.outputs.sha }}
