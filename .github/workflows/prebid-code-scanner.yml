name: Prebid code scanner

on:
  # PRs: "PR info" runs on pull_request without secrets; this runs after it, from the base branch,
  # and scans the PR's files without executing them.
  workflow_run:
    workflows:
      - PR info
    types:
      - completed
  push:
    branches:
      - master
      - '*-legacy'

permissions: {}

jobs:
  scan-push:
    name: "Prebid code scanner"
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Scan
        uses: prebid/code-scanner@main
        with:
          token: ${{ github.token }}
          pem: ${{ secrets.CODE_SCANNER_PEM }}
          appId: ${{ vars.CODE_SCANNER_APPID }}
          installationId: ${{ vars.CODE_SCANNER_INSTALLATION }}

  # Works out which PR and commit to scan, from the base branch's own checkout and trusted-pr action.
  # No secrets and no PR code here.
  pr-info:
    name: "Get PR"
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      number: ${{ steps.pr.outputs.number }}
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Get PR
        id: pr
        uses: ./.github/actions/trusted-pr

  # The only job that has the scanner's secret and the PR's code. The PR's code is only read: this job must never
  # run anything from it (no local actions, installs, builds or scripts), which is what makes checking out fork PRs
  # acceptable here. Keep it to these two steps.
  scan-pr:
    name: "Prebid code scanner"
    needs: pr-info
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.pr-info.outputs.sha }}
          path: pr
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - name: Scan
        # A remote action: it runs its own code, reads the files under pr/ and skips symlinks.
        uses: prebid/code-scanner@main
        with:
          token: ${{ github.token }}
          pem: ${{ secrets.CODE_SCANNER_PEM }}
          appId: ${{ vars.CODE_SCANNER_APPID }}
          installationId: ${{ vars.CODE_SCANNER_INSTALLATION }}
          root: pr
          pr: ${{ needs.pr-info.outputs.number }}
          sha: ${{ needs.pr-info.outputs.sha }}
