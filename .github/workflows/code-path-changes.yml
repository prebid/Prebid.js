name: Notify Code Path Changes

on:
  workflow_run:
    workflows:
      - PR info
    types:
      - completed

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  notify:
    if: ${{ github.repository_owner == 'prebid' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Get PR
        id: pr
        uses: ./.github/actions/trusted-pr

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        # Outside the checkout, so npm doesn't install the repo's own dependencies.
        run: |
          cd "$RUNNER_TEMP"
          npm install --prefix "$RUNNER_TEMP/deps" --no-save --ignore-scripts nodemailer@8.0.5

      - name: Run Notification Script
        env:
          NODE_PATH: ${{ runner.temp }}/deps/node_modules
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PR_NUMBER: ${{ steps.pr.outputs.number }}
          GITHUB_TOKEN: ${{ github.token }}
          NOTIFICATION_EMAIL: 'prebid-notifications@prebid.org'
          NOTIFICATION_PASSWORD: ${{ secrets.NOTIFICATION_PASSWORD }}
        run: node .github/workflows/scripts/send-notification-on-change.js
