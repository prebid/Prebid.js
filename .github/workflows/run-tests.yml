name: Run unit tests
on:
  workflow_call:
    inputs:
      browser:
        description: value to set as the BROWSER env variable
        required: false
        type: string
      chunks:
        description: Number of chunks to split tests into
        required: false
        type: number
        default: 1
      built-key:
        description: Artifact name for built source
        required: true
        type: string
      test-cmd:
        description: Test command, run once per chunk
        required: true
        type: string
      browserstack:
        description: If true, set up browserstack environment and run one test-cmd at a time across all workflow runs
        required: false
        type: boolean
        default: false
      timeout:
        description: Timeout on test run
        required: false
        type: number
        default: 10
      runs-on:
        description: Runner image
        required: false
        default: ubuntu-latest
        type: string
      configure-safari:
        description: Configure Safari
        type: boolean
        required: false
        default: false
      browsers-json:
        description: JSON file listing the browsers to test on (BROWSERS_JSON env variable)
        type: string
        required: false
        default: 'browsers.json'
    secrets:
      BROWSERSTACK_USER_NAME:
        description: "Browserstack user name"
      BROWSERSTACK_ACCESS_KEY:
        description: "Browserstack access key"


permissions:
  contents: read
  actions: read

jobs:
  define:
    name: "Define chunks"
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.chunks.outputs.chunks }}
      id: ${{ steps.chunks.outputs.id }}
    steps:
      - name: Define chunks
        id: chunks
        run: |
          echo 'chunks=[ '$(seq --separator=, 1 1 ${{ inputs.chunks }})' ]' >> out;
          echo 'id='"$(uuidgen)" >> out;
          cat out >> "$GITHUB_OUTPUT";
        
  run-tests:
    needs: [define]
    strategy:
      fail-fast: false
      matrix:
        chunk-no: ${{ fromJSON(needs.define.outputs.chunks) }}

    name: Test${{ inputs.chunks > 1 && format(' chunk {0}', matrix.chunk-no) || '' }}
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USER_NAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      TEST_CHUNKS: ${{ inputs.chunks }}
      TEST_CHUNK: ${{ matrix.chunk-no }}
      BROWSER: ${{ inputs.browser }}
      BROWSER_VERSION: ${{ inputs.browser-version }}
      BROWSERS_JSON: ${{ inputs.browsers-json }}
    concurrency:
      group: ${{ inputs.browserstack && format('browserstack-{0}', inputs.test-cmd) || format('{0}-{1}', needs.define.outputs.id, matrix.chunk-no) }}
      queue: max

    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore source
        uses: ./.github/actions/load
        with:
          name: ${{ inputs.built-key }}

      - name: Configure Safari
        if: ${{ inputs.configure-safari }}
        run: |
          defaults write com.apple.Safari IncludeDevelopMenu YES
          defaults write com.apple.Safari AllowRemoteAutomation 1
          sudo safaridriver --enable

      - name: 'BrowserStack Env Setup'
        if: ${{ inputs.browserstack }}
        uses: 'browserstack/github-actions/setup-env@master'
        with:
          username:  ${{ secrets.BROWSERSTACK_USER_NAME}}
          access-key: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          build-name: Run ${{github.run_id}}, attempt ${{ github.run_attempt }}, chunk ${{ matrix.chunk-no }}, ref ${{ github.event_name == 'pull_request_target' && format('PR {0}', github.event.pull_request.number) || github.ref }}, ${{ inputs.test-cmd }}

      - name: 'BrowserStackLocal Setup'
        if: ${{ inputs.browserstack }}
        uses: 'browserstack/github-actions/setup-local@master'
        with:
          local-testing: start
          local-identifier: random

      - name: Run tests
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: ${{ inputs.timeout }}
          max_attempts: 3
          command: ${{ inputs.test-cmd }}
          shell: bash

      - name: 'BrowserStackLocal Stop'
        if: ${{ inputs.browserstack }}
        uses: 'browserstack/github-actions/setup-local@master'
        with:
          local-testing: stop
