<!--
  Ad server first: this page runs an auction for 2 adunits in which the ad
  server bids into Prebid like any other bidder, instead of Prebid setting
  targeting (e.g. setTargetingForGPTAsync) and handing the decision to the
  ad server. Once bids are back, the page renders the most desirable bid for
  each adunit (see pbjs.getBestBids) directly.

  Notes:

  - add your ad server's bid adapter to each adunit's bids so it competes in
  the auction; the appnexus bids below are placeholders.
  - this approach assumes that the adunit.code is the div name. There
  are many other ways to match the adunit to the div.
  - this approach won't work for refreshed adunits. For that scenario
  you'll need to be more surgical about what's passed into the bidsbackhandler.
  - there's not a separate failsafe timeout here. Since the ad server competes
  inside the Prebid auction rather than waiting on it, Prebid's timeout is
  sufficient.
-->

<html>
<head>
<script>
    var adUnits = [
           {
               code: 'test-div',
                mediaTypes: {
                    banner: {
                        sizes: [[300,250]]
                    }
               },
               bids: [
                   {
                       bidder: 'appnexus',
                       params: {
                           placementId: 13144370
                       }
                   }
               ]
           },
           {
               code: 'test-div2',
                mediaTypes: {
                    banner: {
                        sizes: [[728,90]]
                    }
               },
               bids: [
                   {
                       bidder: 'appnexus',
                       params: {
                           placementId: 13144370
                       }
                   }
               ]
           }
       ];

    var pbjs = pbjs || {};
    pbjs.que = pbjs.que || [];
  </script>
  <script type="text/javascript" src="../../build/dev/prebid.js" async></script>

  <script>
    pbjs.que.push(function() {
        pbjs.addAdUnits(adUnits);
    });

    // no targeting is set and no ad server call is made here: the ad server
    // already bid into the auction, so render the best bid for each adunit.
    // you could instead pass an array of adUnits
    // to getBestBids() if desired
    function renderAllAdUnits() {
        var winners=pbjs.getBestBids();
	for (var i = 0; i < winners.length; i++) {
	  renderOne(winners[i]);
        }
    }

    function renderOne(winningBid) {
	if (winningBid && winningBid.adId) {
	    var div = document.getElementById(winningBid.adUnitCode);
	    if (div) {
	      let iframe = document.createElement('iframe');
	      iframe.frameBorder = '0';
	      div.appendChild(iframe);
	      var iframeDoc = iframe.contentWindow.document;
	      pbjs.renderAd(iframeDoc, winningBid.adId);
	    }
	}

    }

  </script>

<script>
	pbjs.que.push(function() {
          pbjs.requestBids({
	    timeout: 2000,
            bidsBackHandler: renderAllAdUnits
          });
	});
</script>
</head>

<body>
<h2>Ad Server First Test Page</h2>

<div id='test-div'></div>
<br/>
<div id='test-div2'></div>
</body>
</html>
