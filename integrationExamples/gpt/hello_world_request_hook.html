<!--
  Same as hello_world.html, but instead of holding back GPT's request until bids are back, this page
  registers a GPT request hook (googletag.pubads().registerRequestHook). GPT invokes the hook with the
  slots it is about to request and waits for the promise it returns before sending the ad request,
  so the auction and targeting run inside GPT's own request flow.
  GPT races the hook against its own timeout and sends the request anyway if the hook rejects or
  takes too long, so this page needs no failsafe timer of its own.
  NOTE that many ad servers won't send back an ad if the URL is localhost... so you might need to
  set an alias in your /etc/hosts file so that you can load this page from a different domain.
-->

<html>

<head>
    <script async src="../../build/dev/prebid.js"></script>
    <script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js"></script>
    <script>
        var PREBID_TIMEOUT = 1000;

        var adUnits = [{
            code: 'div-gpt-ad-1460505748561-0',
            mediaTypes: {
                banner: {
                    sizes: [[300, 250]],
                }
            },

            // Replace this object to test a new Adapter!
            bids: [{
                bidder: 'appnexus',
                params: {
                    placementId: 13144370
                }
            }]

        }];

        var pbjs = pbjs || {};
        pbjs.que = pbjs.que || [];

        pbjs.que.push(function () {
            pbjs.addAdUnits(adUnits);
        });

    </script>

    <script>
        var googletag = googletag || {};
        googletag.cmd = googletag.cmd || [];

        // Resolves once Prebid has loaded and processed its queue.
        var pbjsReady = new Promise(function (resolve) {
            pbjs.que.push(resolve);
        });

        googletag.cmd.push(function () {
            googletag.pubads().disableInitialLoad();

            var unregisterFn = googletag.pubads().registerRequestHook(async function (context) {
                // Only the first ad request goes through Prebid; later refreshes are sent straight to GAM.
                unregisterFn();
                await pbjsReady;
                await pbjs.requestBids({
                    adUnitCodes: context.slots.map(function (s) { return s.getSlotElementId(); }),
                    timeout: PREBID_TIMEOUT
                });
                pbjs.setTargetingForGPTAsync();
            }, 'request-bids-v4.2');

            googletag.defineSlot('/19968336/header-bid-tag-0', [[300, 250], [300, 600]], 'div-gpt-ad-1460505748561-0').addService(googletag.pubads());

            googletag.pubads().enableSingleRequest();
            googletag.enableServices();
        });
    </script>
</head>

<body>
    <h2>Prebid.js Test</h2>
    <h5>Div-1</h5>
    <div id='div-gpt-ad-1460505748561-0'>
        <script type='text/javascript'>
            googletag.cmd.push(function () {
                googletag.display('div-gpt-ad-1460505748561-0');
                googletag.pubads().refresh();
            });
        </script>
    </div>
</body>

</html>
