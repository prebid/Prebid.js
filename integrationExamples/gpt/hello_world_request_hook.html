<!--
  This page calls a single bidder for a single ad slot using GPT's `registerRequestHook` API so initial
  display(), lazy loading, and slot refreshes automatically run a Prebid auction before each ad request.
  Simply set your server's Bid Params object in the bids array inside the adUnits, and it will use your
  adapter to load an ad.
  NOTE that many ad servers won't send back an ad if the URL is localhost... so you might need to
  set an alias in your /etc/hosts file so that you can load this page from a different domain.
-->

<html>

<head>
    <script async src="../../build/dev/prebid.js"></script>
    <script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js"></script>
    <script>
        const PREBID_TIMEOUT = 1000;
        const REQUEST_HOOK_TIMEOUT = 1500;

        const adUnits = [{
            code: 'div-gpt-ad-1460505748561-0',
            mediaTypes: {
                banner: {
                    sizes: [[300, 250]],
                }
            },

            // Replace this object to test a new Adapter!
            bids: [{
                bidder: 'appnexus',
                params: {
                    placementId: 13144370
                }
            }]

        }];

        window.pbjs = window.pbjs || {};
        pbjs.que = pbjs.que || [];

        pbjs.que.push(function () {
            pbjs.addAdUnits(adUnits);
        });

        window.googletag = window.googletag || {};
        googletag.cmd = googletag.cmd || [];

        googletag.cmd.push(function () {
            googletag.defineSlot('/19968336/header-bid-tag-0', [[300, 250], [300, 600]], 'div-gpt-ad-1460505748561-0')
                .addService(googletag.pubads());

            // Configure single-request mode and a failsafe hook timeout slightly above PREBID_TIMEOUT.
            googletag.setConfig({
                singleRequest: true,
                requestHookTimeoutMs: REQUEST_HOOK_TIMEOUT
            });

            // Register a request hook so GPT awaits the Prebid auction and applies
            // targeting before every outgoing ad request (initial display, lazy load, or refresh).
            googletag.pubads().registerRequestHook(async function ({ slots }) {
                await new Promise(function (resolve) {
                    pbjs.que.push(resolve);
                });
                // Map each requested GPT slot to its matching Prebid adUnit.code.
                // Here adUnit.code is the slot's div ID; use slot.getAdUnitPath() (or a
                // custom matcher) if your adUnits are keyed by GPT ad unit path instead.
                const adUnitCodes = slots.map(function (slot) {
                    return slot.getSlotElementId();
                });
                await pbjs.requestBids({
                    adUnitCodes,
                    timeout: PREBID_TIMEOUT
                });
                pbjs.setTargetingForGPTAsync(adUnitCodes);
            }, 'prebid-docs-request-hook');

            googletag.enableServices();
        });
    </script>
</head>

<body>
    <h2>Prebid.js Test</h2>
    <h5>Div-1</h5>
    <div id='div-gpt-ad-1460505748561-0'>
        <script type='text/javascript'>
            googletag.cmd.push(function () { googletag.display('div-gpt-ad-1460505748561-0'); });
        </script>
    </div>
</body>

</html>
