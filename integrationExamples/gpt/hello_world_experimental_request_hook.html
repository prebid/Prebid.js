<!--
  This example uses GPT's (still experimental) `registerRequestHook` to trigger a Prebid auction on slot refresh.
-->

<html>

<head>
    <script async src="../../build/dev/prebid.js"></script>
    <script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js"></script>
    <script>
      const PREBID_TIMEOUT = 1000;
      const FAILSAFE_TIMEOUT = 3000;

      const adUnits = [{
        code: 'div-gpt-ad-1460505748561-0',
        mediaTypes: {
          banner: {
            sizes: [[300, 250]],
          }
        },

        bids: [{
          bidder: 'appnexus',
          params: {
            placementId: 13144370
          }
        }]

      }];

      window.pbjs = window.pbjs || {};
      pbjs.que = pbjs.que || [];

      pbjs.que.push(function () {
        pbjs.addAdUnits(adUnits);
        pbjs.setConfig({
          debug: true,
          debugging: {
            enabled: true,
            intercept: [
              {
                when: {}
              }
            ]
          }
        });
      });


      window.googletag = window.googletag || {};
      googletag.cmd = googletag.cmd || [];

      googletag.cmd.push(function () {
        googletag.pubads().disableInitialLoad();

        const failSafe = setTimeout(() => {
          googletag.pubads().refresh();
        }, FAILSAFE_TIMEOUT);

        pbjs.que.push(function () {
          clearTimeout(failSafe);
          googletag.pubads().registerRequestHook(async function ({ slots }) {
            const adUnitCodes = slots.map(s => s.getSlotElementId());
            await pbjs.requestBids({
              adUnitCodes,
              timeout: PREBID_TIMEOUT
            });
            pbjs.setTargetingForGPTAsync(adUnitCodes);
          }, 'request-hook-example');
          googletag.pubads().refresh();
        });

        googletag.defineSlot('/19968336/header-bid-tag-0', [[300, 250], [300, 600]], 'div-gpt-ad-1460505748561-0').addService(googletag.pubads());

        googletag.pubads().enableSingleRequest();
        googletag.enableServices();
      });
    </script>
</head>

<body>
<h2>Prebid.js Test</h2>
<h5>Div-1</h5>
<div id='div-gpt-ad-1460505748561-0'>
    <script type='text/javascript'>
      googletag.cmd.push(function () {
        googletag.display('div-gpt-ad-1460505748561-0');
      });
    </script>
</div>
</body>

</html>
